<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Please take a moment to help us improve and serve you better.</p>
    <form id="survey-form">
    <label id="name-label" for="name">Name</label>
    <input id="name" type="text" placeholder="Enter your name" required>
    <label id="email-label" for="email">Email:</label>
    <input id="email" type="email" placeholder="Enter email address" required>
    <label id="number-label" for="number">Age (optional):</label>
    <input id="number" type="number" min="01" max="999" placeholder="Enter your age">
    <label for="dropdown">Which of these best describes your current role?</label>
    <select id="dropdown">
      <option value="student">Student</option>
      <option value="unemployed">Unemployed</option>
      <option value="self-employed">Self-Employed</option>
      <option value="employed">Employed</option>
      </select>
      <p>Would you recommend our brand to a friend?</p>
      <label>
        <input type="radio" name="recommend" value="definitely">Definitely
          </label>
          <label>
            <input type="radio" name="recommend" value="maybe">Maybe
            </label>
            <p>Which of our products would you like to see improved? (Check all that apply)</p>
            <label>
              <input type="checkbox" value="sneakers">Sneakers
              </label>
              <label>
                <input type="checkbox" value="shirts">Shirts
                </label>
              <label>
                <input type="checkbox" value="watches">Watches
                </label>
                <label>
                  <input type="checkbox" value="trousers">Trousers
                  </label>
                  <label>
                    <input type="checkbox" value="perfumes">Perfumes
                    </label>
        <label for="comments">Any suggestions or comments?</label>
        <textarea id="comments" placeholder="Enter your suggestions or comments here."></textarea>
        <button id="submit" type="submit">Submit</submit>
              

  </body>
</html>
