<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="business-card">
        <img class="profile-image"src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="A beautiful sunflower">
        <p class="full-name">Arinzechukwu Francis</p>
        <p class="designation">DevOps and Full Stack Developer</p>
        <p class="company">Ferd's Conglomertate</p>
        <hr>
        <p>Email Address</p>
        <p>Phone Number</p>
        <a class="portfolio-link" href="https://cdn.freecodecamp.org">Portfolio</a>
        <hr>
        
        <div class="social-media">
            <h2>Connect with me</h2>
            <a href="https://twitter.com">Twitter</a>
            <a href="https://LinkedIn.com">LinkedIn</a>
            <a href="https://GitHub.com">GitHub</a>
        </div>

</body>

</html>
